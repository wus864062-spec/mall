syntax = "proto3";

package api.product.v1;

import "google/api/annotations.proto";

option go_package = "mall/api/product/v1;v1";

// 用户侧只读目录。上架/改库存放到阶段四后台。
service ProductService {
  rpc GetProduct (GetProductRequest) returns (GetProductReply) {
    option (google.api.http) = {
      get: "/v1/products/{id}"
    };
  }
  rpc ListProducts (ListProductsRequest) returns (ListProductsReply) {
    option (google.api.http) = {
      get: "/v1/products"
    };
  }
}

message Product {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 price_fen = 4;
  int64 stock = 5;
  string image = 6;
  int64 category_id = 7;
  int32 status = 8;
}

message GetProductRequest { int64 id = 1; }
message GetProductReply { Product product = 1; }

message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 category_id = 3;
}
message ListProductsReply {
  repeated Product products = 1;
  int64 total = 2;
}
